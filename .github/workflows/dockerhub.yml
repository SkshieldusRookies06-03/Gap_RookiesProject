
name: dockerhub-build-push

on:
  push:
    branches: [ feature/infra, dev ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@${{ github.sha }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. 백엔드 도커 이미지 빌드 & 푸시
      - name: Build and push Backend Image
        uses: docker/build-push-action@${{ github.sha }}
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gap-backend:${{ github.sha }}

      # 2. 프론트엔드 도커 이미지 빌드 & 푸시 (필요시 경로 조정)
      - name: Build and push Frontend Image
        uses: docker/build-push-action@${{ github.sha }}
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gap-frontend:${{ github.sha }}

      # 3. ai-module 도커 이미지 빌드 & 푸시 (필요시 경로 조정)
      - name: Build and push ai-langchain Image
        uses: docker/build-push-action@${{ github.sha }}
        with:
          context: ./ai-module
          file: ./ai-module/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gap-ai-module:${{ github.sha }}
