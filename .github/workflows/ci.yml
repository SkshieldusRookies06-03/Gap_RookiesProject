# 오너: DevOps · 기술 리드 리뷰 — 판정 테스트는 착수 전 red로 커밋되므로 두 단계로 나눈다(스킬 role-task-split §8)
# 1단계(필수): 컴파일·빌드·컨텍스트 기동 · 2단계(현황판): 판정 테스트 — D5에 continue-on-error 줄을 지워 필수로 올린다
# 빌드·푸시(GHA → Docker Hub/ECR)는 별도 워크플로 3개(T-041 · DevOps)
name: ci
on:
  push: { branches: [main, dev, "feature/**"] }
  pull_request: { branches: [dev, main] }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.11.10
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: jobgap, MARIADB_USER: jobgap, MARIADB_PASSWORD: jobgap, TZ: Asia/Seoul }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: 1단계 — 컴파일 + 컨텍스트 기동 (필수)
        run: mvn -B test -Dtest='JobgapApplicationTests,PiiMaskerTest,PiiMaskerEdgeTest,GlobalExceptionHandlerTest,CorsConfigTest'   # 러너에 Maven 설치돼 있음 — mvnw 없이도 돈다 · 뒤 셋은 DB 없는 단위 회귀
      - name: 2단계 — 판정 테스트 현황 (D5까지 red 허용)
        run: mvn -B test
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: 1단계 — 빌드 + 공용 테스트 (필수)
        run: npm run build && npx vitest run src/api src/components   # 공용 모듈 + 회귀(session·ErrorMessage)
      - name: 2단계 — 화면·훅 판정 테스트 현황 (D5까지 red 허용)
        run: npm test
        continue-on-error: true

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-module } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ai-module/requirements.txt }
      - run: pip install -r requirements.txt
      - name: 1단계 — 토큰·헬스 (필수)
        run: pytest -q tests/test_hardening.py tests/test_contract.py -k "hardening or health or require_token"
      - name: 2단계 — 판정 테스트 현황 (D5까지 red 허용)
        run: pytest -q
        continue-on-error: true
