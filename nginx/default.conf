# 오너: DevOps (T-032) · 한 장이 두 일: SPA fallback + /api 프록시 (스킬 P3-5)
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;              # = Spring max-request-size 1MB (파일 200KB 초과는 Spring이 봉투 413)

    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SSE 스트림 — 버퍼링 끄기 · 300s = spring.mvc.async.request-timeout
    location = /api/analyses/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
