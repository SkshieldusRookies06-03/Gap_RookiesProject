# 오너: DevOps (T-032) · 한 장이 두 일: SPA fallback + /api 프록시 (스킬 P3-5)
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;              # = Spring max-request-size 1MB (파일 200KB 초과는 Spring이 봉투 413)

    root /usr/share/nginx/html;

    # backend를 요청 때마다 다시 찾는다 — backend만 재생성해도 502가 나지 않게(Docker 내장 DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SSE 스트림 — 버퍼링 끄기 · 타임아웃 사슬 WebClient 290s < Spring async 300s < nginx 310s
    location = /api/analyses/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 재배포 뒤 흰 화면 방지 — index.html은 매번 확인, 없는 해시 파일은 HTML 대신 404(nosniff + module 스크립트 MIME 오류 방지).
    # add_header를 location 안에 쓰면 server의 add_header가 상속되지 않는다 → 보안 헤더를 다시 적는다.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
