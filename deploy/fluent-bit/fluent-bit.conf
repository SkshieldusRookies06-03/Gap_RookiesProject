[SERVICE]
    Flush             1
    Log_Level         info
    Daemon            off
    Parsers_File      parsers.conf

[INPUT]
    Name              tail
    Tag               app.*
    Path              /var/log/app-logs/*.log
    Parser            docker
    DB                /var/log/flb_app.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   off

[OUTPUT]
    Name              stdout
    Match             *