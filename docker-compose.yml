# 오너: DevOps (T-023 · T-032) · 정본: SPEC §1 포트 행 · 스킬 P3-0.1 compose 구조 행
# 외부 공개는 frontend 80 하나. backend·ai-service·database에는 ports를 두지 않는다(점검서 I-3 · A-1).
# 디버깅: docker compose -f docker-compose.yml -f docker-compose.dev.yml up  (127.0.0.1에만 바인드)
services:
  database:
    image: mariadb:10.11.10
    environment:
      MARIADB_DATABASE: ${DB_NAME:?.env에 DB_NAME 필요}
      MARIADB_USER: ${DB_USER:?.env에 DB_USER 필요}
      MARIADB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD 필요}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env에 DB_ROOT_PASSWORD 필요}
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+09:00"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped

  ai-service:
    build: ./ai-module
    environment:                      # 이 서비스에 필요한 키만 (A-5 · 최소 권한)
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?.env에 AI_INTERNAL_TOKEN 필요}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LLM_PROVIDER: openai
      CHROMA_DIR: /data/vector
    volumes:
      - vector-data:/data/vector
    networks: [app]                   # app은 일반 bridge — LLM·임베딩·Tavily로 나가야 한다
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mariadb://database:3306/${DB_NAME:?.env에 DB_NAME 필요}
      DB_USER: ${DB_USER:?.env에 DB_USER 필요}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD 필요}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET(32바이트+) 필요}
      AI_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?.env에 AI_INTERNAL_TOKEN 필요}
      # 기본값을 compose에 둔다 — .env에서 빠지면 빈 문자열이 들어가 Spring 기본값이 무시되고(health 미노출 → unhealthy) frontend가 못 뜬다
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ACTUATOR_EXPOSURE: ${ACTUATOR_EXPOSURE:-health,info}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}   # 데모 시드 재적용: seed
    depends_on:
      database: { condition: service_healthy }
      ai-service: { condition: service_healthy }
    networks: [edge, app, data]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

networks:
  edge: {}
  app: {}
  data:
    internal: true                    # DB만 외부 연결 차단

volumes:
  db-data: {}
  vector-data: {}
