# 오너: BE-기능(파일) · security·ai 블록은 기술 리드 리뷰 · 값의 정본은 SPEC.md §1
spring:
  application.name: jobgap
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/jobgap}
    username: ${DB_USER:jobgap}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: Asia/Seoul
    properties.hibernate.timezone.default_storage: NORMALIZE   # OffsetDateTime ↔ DATETIME(6)
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql.init.mode: never
  jackson:
    time-zone: Asia/Seoul
    datatype.datetime.write-dates-as-timestamps: false
  servlet.multipart:
    max-file-size: 200KB        # SPEC §1 업로드 — nginx client_max_body_size 1m 과 짝
    max-request-size: 1MB
  mvc.async.request-timeout: 300s   # SSE 중계 — 사슬: WebClient 290s < 이 값 < nginx 310s (먼저 끊기는 쪽이 event: error를 낼 수 있게)

server:
  port: 8080
  forward-headers-strategy: native   # nginx의 X-Forwarded-* → 실제 IP·스킴(감사 로그 IP · CORS 판정)
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints.web.exposure.include: ${ACTUATOR_EXPOSURE:health,info}
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: false   # Boot 4 기본값이면 응답에 groups가 붙는다 — SPEC §1 관측값 {"status":"UP"} 유지

app:
  jwt:
    secret: ${JWT_SECRET:}                       # 32바이트 이상 — 비어 있으면 기동 실패(의도)
    access-token-expiration: 900000              # 15분 (ms)
    refresh-token-expiration: 1209600000         # 14일 (ms)
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  login.max-failures: 5
  login.lock-minutes: 15
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    stream-timeout-seconds: 290
    history-size: 6

logging.level.com.jobgap: INFO
